[project]
name = "item-extractor"
version = "0.1.0"
description = "Extract todos, tasks, reminders, and events from natural language"
readme = "README.md"
authors = [
    { name = "UnknwnDev", email = "0unknwn.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
    "spacy>=3.8.16",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
